name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Dépendances Composer
        run: composer install --prefer-dist --no-interaction --no-progress --no-scripts

      - name: Environnement
        run: cp .env.example .env && php artisan key:generate

      - name: Formatage (Pint)
        run: ./vendor/bin/pint --test

      - name: Tests (Pest)
        run: ./vendor/bin/pest

      - name: Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # public/build est versionné (un hébergement mutualisé n'a pas Node) :
      # il doit correspondre exactement aux sources.
      - name: public/build à jour
        run: |
          npm ci
          npm run build
          if [ -n "$(git status --porcelain public/build)" ]; then
            git status --short public/build
            echo "public/build n'est pas à jour : lancez npm run build et committez le résultat."
            exit 1
          fi
